<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống OCR Tiếng Việt Chuẩn - Chống lỗi Font</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://unpkg.com/tesseract.js@v4.0.1/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        :root { --primary: #007bff; --success: #28a745; --excel: #1d6f42; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 350px 1fr; gap: 20px; }
        .sidebar { background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); height: fit-content; }
        .dropzone { border: 2px dashed var(--primary); padding: 25px; border-radius: 12px; text-align: center; cursor: pointer; background: #f0f7ff; margin-bottom: 20px; }
        #textEditor { width: 100%; height: 650px; border: 1px solid #ddd; padding: 20px; border-radius: 10px; font-size: 16px; line-height: 1.8; font-family: 'Times New Roman', serif; outline: none; }
        .progress-wrapper { display: none; height: 10px; background: #eee; border-radius: 5px; margin: 15px 0; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background: var(--success); transition: 0.3s; }
        .btn-group { display: flex; flex-direction: column; gap: 10px; }
        button { padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; color: white; }
        .btn-run { background: var(--primary); }
        .btn-word { background: var(--success); display: none; }
        .btn-excel { background: var(--excel); display: none; }
        select { width: 100%; padding: 10px; margin-top: 5px; border-radius: 5px; border: 1px solid #ccc; }
        #status { font-size: 13px; color: #e74c3c; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

<h2 style="text-align:center; color: #2c3e50;">OCR Tiếng Việt Chuyên Sâu</h2>

<div class="container">
    <div class="sidebar">
        <div class="dropzone" onclick="document.getElementById('fileInput').click()">
            <strong id="fileName">Tải PDF hoặc Ảnh lên</strong>
            <input type="file" id="fileInput" accept=".pdf, image/*" hidden>
        </div>

        <div style="margin-bottom: 15px;">
            <label><b>Chọn Font cho file Word:</b></label>
            <select id="fontSelect">
                <option value="'Times New Roman', serif">Times New Roman</option>
                <option value="Arial, sans-serif">Arial</option>
                <option value="'Calibri', sans-serif">Calibri</option>
            </select>
        </div>

        <div id="status">Sẵn sàng.</div>

        <div class="progress-wrapper" id="progWrap">
            <div class="progress-bar" id="progBar"></div>
        </div>

        <div class="btn-group">
            <button class="btn-run" id="startBtn">Bắt đầu nhận dạng</button>
            <button class="btn-word" id="btnW" onclick="saveWord()">Tải file Word (.doc)</button>
            <button class="btn-excel" id="btnE" onclick="saveExcel()">Tải file Excel (.xlsx)</button>
            <button style="background:#6c757d" onclick="copyToClip()">Sao chép nhanh</button>
        </div>
    </div>

    <div class="content">
        <textarea id="textEditor" placeholder="Kết quả sẽ hiển thị tại đây..."></textarea>
    </div>
</div>

<script>
    const pdfjsLib = window['pdfjs-dist/build/pdf'];
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

    const fileInput = document.getElementById('fileInput');
    const textEditor = document.getElementById('textEditor');
    const progBar = document.getElementById('progBar');
    const status = document.getElementById('status');

    fileInput.onchange = () => { if(fileInput.files[0]) document.getElementById('fileName').innerText = fileInput.files[0].name; };

    document.getElementById('startBtn').onclick = async () => {
        const file = fileInput.files[0];
        if (!file) return alert("Vui lòng chọn file!");
        
        setLoading(true);
        if (file.type === "application/pdf") {
            await handlePDF(file);
        } else {
            await handleImage(file);
        }
    };

    async function handleImage(file) {
        status.innerText = "Đang quét ảnh bằng AI...";
        const { data: { text } } = await Tesseract.recognize(file, 'vie');
        textEditor.value = smartFix(text);
        finish();
    }

    async function handlePDF(file) {
        const reader = new FileReader();
        reader.readAsArrayBuffer(file);
        reader.onload = async function() {
            const pdf = await pdfjsLib.getDocument({data: reader.result, cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.4.120/cmaps/', cMapPacked: true}).promise;
            let result = "";
            for (let i = 1; i <= pdf.numPages; i++) {
                status.innerText = `Đang đọc trang ${i}/${pdf.numPages}`;
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                let txt = textContent.items.map(s => s.str).join(" ");

                if (txt.length < 20) { // Nếu trang là ảnh scan
                    const canvas = await pdfToCanvas(page);
                    const { data: { text } } = await Tesseract.recognize(canvas, 'vie');
                    txt = text;
                }
                result += smartFix(txt) + "\n\n";
                textEditor.value = result;
                progBar.style.width = (i / pdf.numPages * 100) + "%";
            }
            finish();
        };
    }

    // THUẬT TOÁN SỬA LỖI FONT & RỜI CHỮ
    function smartFix(str) {
        if (!str) return "";
        return str
            .replace(/([A-ZÀ-Ỹ])\s(?=[A-ZÀ-Ỹ]\s)/g, '$1') // Ghép các chữ cái rời: Đ Ả N G -> ĐẢNG
            .replace(/\s{2,}/g, ' ')                      // Xóa khoảng trắng kép
            .replace(/(\w)\s([.,!?:])/g, '$1$2')          // Sửa lỗi cách dấu câu: "chữ ." -> "chữ."
            .trim();
    }

    async function pdfToCanvas(page) {
        const viewport = page.getViewport({scale: 2});
        const canvas = document.createElement('canvas');
        canvas.height = viewport.height; canvas.width = viewport.width;
        await page.render({canvasContext: canvas.getContext('2d'), viewport}).promise;
        return canvas;
    }

    function setLoading(is) {
        document.getElementById('progWrap').style.display = is ? 'block' : 'none';
        document.getElementById('btnW').style.display = document.getElementById('btnE').style.display = 'none';
        progBar.style.width = "0%";
    }

    function finish() {
        status.innerText = "Hoàn thành!";
        document.getElementById('btnW').style.display = document.getElementById('btnE').style.display = 'block';
    }

    function saveWord() {
        const font = document.getElementById('fontSelect').value;
        const html = `<html><head><meta charset='utf-8'><style>body{font-family:${font}; line-height:1.6;}</style></head><body>${textEditor.value.replace(/\n/g, '<br>')}</body></html>`;
        const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "Van_ban_OCR.doc"; a.click();
    }

    function saveExcel() {
        const rows = textEditor.value.split('\n').map(r => [r]);
        const ws = XLSX.utils.aoa_to_sheet(rows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Dữ liệu");
        XLSX.writeFile(wb, "Du_lieu_Excel.xlsx");
    }

    function copyToClip() { textEditor.select(); document.execCommand('copy'); alert("Đã sao chép!"); }
</script>
</body>
</html>
